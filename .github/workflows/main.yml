name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      # Update Index.html
      - name: Update HTML
        run: |
          # Update Index
          if [ "${{ github.actor }}" == "DakshPatel2007" ]; then 
            sed -i "/<\/body>/i <p>Updated by Owner on '$(date)'<\/p>" index.html
          fi
      # Update README
      - name: Update README
        run: |  
          echo "### Updated by ${{ github.actor }} on $(date +%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
      # Commit changes back to the repository
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{github.actor}}"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository}}
          git push
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    